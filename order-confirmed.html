<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Status — The White Butterflies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            butterfly: {50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a'},
            cream: {50:'#fff9ed',100:'#fef3d9',200:'#fce7b3',300:'#fbdb8d',400:'#f9cf67',500:'#f8c341',600:'#c69c34',700:'#947527',800:'#634e1a',900:'#31270d'}
          },
          fontFamily: {serif:['Cormorant Garamond','ui-serif','Georgia','serif'],sans:['Inter','ui-sans-serif','system-ui','sans-serif']},
          boxShadow: {soft:'0 10px 30px rgba(0,0,0,0.08)'}
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-cream-50 text-butterfly-900 font-sans min-h-screen">

<header class="border-b border-cream-200">
  <div class="max-w-4xl mx-auto px-4 py-5">
    <a href="index.html" class="font-serif tracking-[0.25em] text-lg md:text-xl">THE WHITE BUTTERFLIES</a>
  </div>
</header>

<main class="py-16 md:py-24">
  <div class="max-w-3xl mx-auto px-4">

    <section id="paymentLoading" class="rounded-2xl bg-white shadow-soft p-8 text-center">
      <p class="text-sm uppercase tracking-[0.2em] text-cream-700 mb-3">Checking payment</p>
      <h1 class="font-serif text-4xl mb-4">One moment.</h1>
      <p class="text-butterfly-600">We are checking the payment directly with Mollie.</p>
    </section>

    <section id="confirmationCard" class="hidden rounded-2xl bg-white shadow-soft p-7 md:p-10">
      <p id="statusEyebrow" class="text-sm uppercase tracking-[0.2em] text-cream-700 mb-3"></p>
      <h1 id="statusTitle" class="font-serif text-5xl md:text-6xl leading-tight mb-5"></h1>
      <p id="confirmationMessage" class="text-lg text-butterfly-600 mb-8"></p>

      <div id="paymentStatusBox" class="rounded-xl bg-cream-100 border border-cream-200 p-5 mb-5"></div>
      <div id="orderDetails" class="hidden rounded-xl bg-cream-50 border border-cream-200 p-5 mb-7"></div>

      <div class="flex flex-wrap gap-3">
        <button id="downloadInvoice" class="hidden px-6 py-3 rounded-full bg-butterfly-900 text-white hover:opacity-90">
          Download Invoice
        </button>

        <a id="retryPayment" href="checkout.html" class="hidden px-6 py-3 rounded-full bg-butterfly-900 text-white hover:opacity-90">
          Return to checkout
        </a>

        <button id="checkAgain" type="button" class="hidden px-6 py-3 rounded-full border border-butterfly-900/20 hover:bg-cream-50">
          Check payment again
        </button>

        <a href="index.html" class="px-6 py-3 rounded-full border border-butterfly-900/20 hover:bg-cream-50">
          Return to the shop
        </a>
      </div>
    </section>

    <section id="missingOrder" class="hidden rounded-2xl bg-white shadow-soft p-8 text-center">
      <h1 class="font-serif text-4xl mb-4">We could not verify this payment.</h1>
      <p id="missingOrderText" class="text-butterfly-600 mb-6">
        Please return to checkout rather than paying twice.
      </p>
      <a href="checkout.html" class="inline-block px-6 py-3 rounded-full bg-butterfly-900 text-white">
        Return to checkout
      </a>
    </section>

  </div>
</main>

<iframe
  id="statusBridgeFrame"
  name="statusBridgeFrame"
  class="hidden"
  title="Payment status bridge">
</iframe>

<footer class="py-10 text-center text-sm text-butterfly-500">© <span id="year"></span> The White Butterflies</footer>

<script>
  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbwiNI4sVCokxOIsQptKXeMGrR2BMkBEPLvO7wQ-Yrut7sPm9I8Xs6OWNm55ORTjzXm8JA/exec';

  document.getElementById('year').textContent =
    new Date().getFullYear();

  const params =
    new URLSearchParams(
      window.location.search
    );

  const orderId =
    params.get('orderId') ||
    sessionStorage.getItem(
      'twb_pending_order_id'
    ) ||
    '';

  const rawPendingOrder =
    sessionStorage.getItem(
      'twb_pending_order'
    );

  let order = null;

  try {
    order = rawPendingOrder
      ? JSON.parse(rawPendingOrder)
      : null;
  } catch {
    order = null;
  }

  const loading =
    document.getElementById(
      'paymentLoading'
    );

  const card =
    document.getElementById(
      'confirmationCard'
    );

  const missing =
    document.getElementById(
      'missingOrder'
    );

  const downloadButton =
    document.getElementById(
      'downloadInvoice'
    );

  const checkAgain =
    document.getElementById(
      'checkAgain'
    );

  const statusBridgeFrame =
    document.getElementById(
      'statusBridgeFrame'
    );

  let activeStatusToken = '';
  let statusAttempts = 0;
  let statusTimer = null;
  let bridgeResponseTimeout = null;


  function formatEUR(value) {
    return (
      '€' +
      Number(value || 0)
        .toFixed(2)
    );
  }


  function makeBridgeToken() {
    if (
      window.crypto &&
      typeof window.crypto.randomUUID === 'function'
    ) {
      return window.crypto
        .randomUUID()
        .replace(/-/g, '');
    }

    return (
      Date.now().toString(36) +
      Math.random().toString(36).slice(2) +
      Math.random().toString(36).slice(2)
    );
  }


  function showMissing(message) {
    clearTimeout(statusTimer);
    clearTimeout(bridgeResponseTimeout);

    loading.classList.add('hidden');
    card.classList.add('hidden');
    missing.classList.remove('hidden');

    if (message) {
      document
        .getElementById(
          'missingOrderText'
        )
        .textContent = message;
    }
  }


  function renderOrderDetails() {
    if (!order) return;

    const details =
      document.getElementById(
        'orderDetails'
      );

    const items =
      order.items || [];

    const totals =
      order.totals || {};

    const discount =
      order.discount || {};

    const itemLines =
      items.map(item => `
        <div class="flex justify-between gap-4 py-2">
          <span>${item.qty} × ${item.name}</span>
          <span>${formatEUR(item.price * item.qty)}</span>
        </div>
      `).join('');

    const discountLine =
      Number(discount.amount || 0) > 0
        ? `
          <div class="flex justify-between gap-4 py-2 text-cream-700">
            <span>Discount (${discount.code})</span>
            <span>−${formatEUR(discount.amount)}</span>
          </div>
        `
        : '';

    details.innerHTML = `
      <div class="mb-4">${itemLines}</div>
      <div class="border-t border-cream-200 pt-3 text-sm space-y-1">
        <div class="flex justify-between"><span>Subtotal</span><span>${formatEUR(totals.subtotal)}</span></div>
        <div class="flex justify-between"><span>Shipping</span><span>${formatEUR(totals.shipping)}</span></div>
        ${discountLine}
        <div class="flex justify-between font-medium text-lg pt-2"><span>Total</span><span>${formatEUR(totals.total)}</span></div>
      </div>
    `;

    details.classList.remove('hidden');
  }


  function clearCartAfterAcceptedOrder() {
    try {
      localStorage.setItem(
        'twb_cart_v1',
        '[]'
      );
    } catch {}
  }


  function showPaymentState(statusData) {
    clearTimeout(statusTimer);

    // Prefer the server-side order snapshot. This means the invoice still
    // works after a refresh/new tab even if sessionStorage is gone.
    if (statusData && statusData.order) {
      order = statusData.order;
    }

    loading.classList.add('hidden');
    missing.classList.add('hidden');
    card.classList.remove('hidden');

    const status =
      String(statusData.status || '');

    const method =
      String(statusData.method || '');

    const statusBox =
      document.getElementById(
        'paymentStatusBox'
      );

    const retry =
      document.getElementById(
        'retryPayment'
      );

    const title =
      document.getElementById(
        'statusTitle'
      );

    const eyebrow =
      document.getElementById(
        'statusEyebrow'
      );

    const message =
      document.getElementById(
        'confirmationMessage'
      );

    const paymentMethodLabels = {
      mollie_checkout: 'Mollie Checkout',
      ideal: 'iDEAL',
      bancontact: 'Bancontact',
      creditcard: 'Credit / debit card',
      paybybank: 'Pay by Bank',
      paypal: 'PayPal',
      banktransfer: 'Bank transfer via Mollie',
      applepay: 'Apple Pay',
      googlepay: 'Google Pay',
      eps: 'EPS',
      kbc: 'KBC/CBC',
      belfius: 'Belfius',
      mybank: 'MyBank',
      przelewy24: 'Przelewy24'
    };

    const paymentMethodLabel =
      paymentMethodLabels[method.toLowerCase()] ||
      method ||
      'Mollie Checkout';

    statusBox.innerHTML = `
      <div class="flex justify-between gap-4">
        <span class="text-butterfly-600">Order</span>
        <strong>${statusData.orderId || orderId}</strong>
      </div>

      <div class="flex justify-between gap-4 mt-2">
        <span class="text-butterfly-600">Payment method</span>
        <span>${paymentMethodLabel}</span>
      </div>

      <div class="flex justify-between gap-4 mt-2">
        <span class="text-butterfly-600">Payment status</span>
        <strong>${status.toUpperCase()}</strong>
      </div>

      <div class="flex justify-between gap-4 mt-2">
        <span class="text-butterfly-600">Amount</span>
        <span>${formatEUR(statusData.amount?.value)}</span>
      </div>
    `;

    retry.classList.add('hidden');
    checkAgain.classList.add('hidden');
    downloadButton.classList.add('hidden');

    if (status === 'paid') {
      eyebrow.textContent =
        'Payment received';

      title.textContent =
        'Thank you.';

      message.innerHTML =
        `Your order <strong>${statusData.orderId || orderId}</strong> has been paid successfully. A confirmation email with your invoice is being sent to the email used at checkout.`;

      clearCartAfterAcceptedOrder();

      if (order) {
        order.payment = {
          ...(order.payment || {}),
          id: statusData.paymentId,
          method,
          status,
          paidAt: statusData.paidAt || ''
        };

        sessionStorage.setItem(
          'twb_last_order',
          JSON.stringify(order)
        );

        renderOrderDetails();

        // The invoice button is back, and it no longer depends solely
        // on the pre-Mollie browser session surviving the redirect.
        downloadButton.classList.remove('hidden');
      }

      sessionStorage.removeItem('twb_pending_order');
      sessionStorage.removeItem('twb_pending_order_id');
      sessionStorage.removeItem('twb_pending_payment_id');
      return;
    }


    if (
      ['failed', 'canceled', 'expired'].includes(status)
    ) {
      eyebrow.textContent =
        'Payment not completed';

      title.textContent =
        status === 'canceled'
          ? 'Payment cancelled.'
          : status === 'expired'
            ? 'Payment expired.'
            : 'Payment failed.';

      message.textContent =
        'Your bag has been kept. You can return to checkout and try again.';

      retry.classList.remove('hidden');
      return;
    }

    eyebrow.textContent =
      'Payment being confirmed';

    title.textContent =
      'Almost there.';

    message.textContent =
      'Mollie is still confirming the payment. Do not place another order yet.';

    checkAgain.classList.remove('hidden');

    if (
      ['open', 'pending', 'authorized'].includes(status) &&
      statusAttempts < 5
    ) {
      statusTimer =
        setTimeout(
          requestPaymentStatus,
          1800
        );
    }
  }


  window.addEventListener(
    'message',
    event => {
      // Google Apps Script HTML Service adds its own sandboxed iframe.
      // Because of that, event.source is not guaranteed to equal the
      // outer hidden iframe (statusBridgeFrame.contentWindow).
      // The random one-time bridgeToken below is our correlation check.
      const data =
        event.data || {};

      if (
        data.type !==
          'twb-payment-status' ||
        data.bridgeToken !==
          activeStatusToken
      ) {
        return;
      }

      clearTimeout(
        bridgeResponseTimeout
      );

      if (!data.ok) {
        if (statusAttempts < 4) {
          statusTimer =
            setTimeout(
              requestPaymentStatus,
              1800
            );
          return;
        }

        showMissing(
          data.error ||
          'We could not verify this payment. If your bank shows a successful payment, do not pay again.'
        );
        return;
      }

      showPaymentState(data);
    }
  );


  function requestPaymentStatus() {
    if (!orderId) {
      showMissing(
        'The order reference is missing. If you were charged, contact us rather than paying again.'
      );
      return;
    }

    if (
      !APPS_SCRIPT_URL ||
      APPS_SCRIPT_URL.includes(
        'PASTE_YOUR_CURRENT'
      )
    ) {
      showMissing(
        'The payment status service has not been configured yet.'
      );
      return;
    }

    statusAttempts += 1;
    activeStatusToken =
      makeBridgeToken();

    const url =
      new URL(
        APPS_SCRIPT_URL
      );

    url.searchParams.set(
      'action',
      'payment_status'
    );

    url.searchParams.set(
      'orderId',
      orderId
    );

    url.searchParams.set(
      'bridgeToken',
      activeStatusToken
    );

    url.searchParams.set(
      '_',
      String(Date.now())
    );

    statusBridgeFrame.src =
      url.toString();

    clearTimeout(
      bridgeResponseTimeout
    );

    bridgeResponseTimeout =
      setTimeout(
        () => {
          if (statusAttempts < 4) {
            requestPaymentStatus();
            return;
          }

          showMissing(
            'The payment service did not answer. If your bank shows a successful payment, do not pay again; contact us with your order number.'
          );
        },
        20000
      );
  }


  checkAgain.addEventListener(
    'click',
    () => {
      loading.classList.remove('hidden');
      card.classList.add('hidden');
      requestPaymentStatus();
    }
  );


  function prettyPaymentMethod(method) {
    const labels = {
      mollie_checkout: 'Mollie Checkout',
      ideal: 'iDEAL',
      bancontact: 'Bancontact',
      creditcard: 'Credit / debit card',
      paybybank: 'Pay by Bank',
      paypal: 'PayPal',
      banktransfer: 'Bank transfer via Mollie',
      applepay: 'Apple Pay',
      googlepay: 'Google Pay',
      eps: 'EPS',
      kbc: 'KBC/CBC',
      belfius: 'Belfius',
      mybank: 'MyBank',
      przelewy24: 'Przelewy24'
    };

    const value = String(method || '').toLowerCase();
    return labels[value] || method || 'Mollie Checkout';
  }


  // ============================================================
  // PDF ORDER CONFIRMATION
  // ============================================================

  let jsPdfPromise = null;

  function loadJsPdf() {
    if (window.jspdf) {
      return Promise.resolve(window.jspdf);
    }

    if (jsPdfPromise) {
      return jsPdfPromise;
    }

    jsPdfPromise =
      new Promise((resolve, reject) => {
        const script =
          document.createElement('script');

        script.src =
          'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

        script.onload =
          () => resolve(window.jspdf);

        script.onerror = reject;
        document.body.appendChild(script);
      });

    return jsPdfPromise;
  }


  downloadButton.addEventListener(
    'click',
    async () => {
      if (!order) return;

      await loadJsPdf();

      const { jsPDF } =
        window.jspdf;

      const customer =
        order.customer || {};

      const totals =
        order.totals || {};

      const discount =
        order.discount || {};

      const items =
        order.items || [];

      const payment =
        order.payment || {};

      const doc =
        new jsPDF({
          unit: 'pt',
          format: 'a4'
        });

      const cream = '#fff9ed';
      const textColor = '#1e293b';
      const gold = '#c69c34';

      doc.setFillColor(cream);
      doc.rect(0, 0, 595, 842, 'F');
      doc.setFont('Times', 'normal');
      doc.setFontSize(20);
      doc.setTextColor(textColor);
      doc.text('T  H  E     W  H  I  T  E     B  U  T  T  E  R  F  L  I  E  S', 65, 70);
      doc.setDrawColor(gold);
      doc.setLineWidth(0.5);
      doc.line(60, 85, 535, 85);
      doc.setFontSize(14);
      doc.text('Invoice', 65, 115);

      let y = 140;
      doc.setFontSize(11);
      doc.text(`Order ID: ${order.orderId}`, 65, y); y += 16;
      doc.text(`Date: ${new Date(order.timestamp).toLocaleDateString()}`, 65, y); y += 16;
      doc.text(`Payment: ${prettyPaymentMethod(payment.method)} · ${String(payment.status || '').toUpperCase()}`, 65, y); y += 30;

      doc.setFontSize(12);
      doc.text('Billing Information', 65, y); y += 14;
      doc.line(65, y, 250, y); y += 14;
      doc.setFontSize(11);
      doc.text(`${customer.fullName || ''}`, 65, y); y += 14;
      doc.text(
        `${customer.address || `${customer.streetName || ''} ${customer.houseNumber || ''}`.trim()}`,
        65,
        y
      ); y += 14;
      doc.text(`${customer.city || ''}, ${customer.postcode || ''}`, 65, y); y += 14;
      doc.text(`${customer.country || ''}`, 65, y); y += 30;

      doc.setFontSize(12);
      doc.text('Items', 65, y);
      doc.line(65, y + 2, 250, y + 2); y += 20;

      items.forEach(item => {
        doc.setFontSize(11);
        const wrapped = doc.splitTextToSize(`${item.qty} × ${item.name}`, 330);
        doc.text(wrapped, 65, y);
        doc.text(formatEUR(item.price * item.qty), 500, y, {align:'right'});
        y += Math.max(16, wrapped.length * 13);
      });

      y += 10;
      doc.line(65, y, 535, y); y += 20;
      doc.setFontSize(12);
      doc.text(`Subtotal: ${formatEUR(totals.subtotal)}`, 500, y, {align:'right'}); y += 16;
      doc.text(`Shipping: ${formatEUR(totals.shipping)}`, 500, y, {align:'right'}); y += 16;

      if (Number(discount.amount || 0) > 0) {
        doc.text(`Discount (${discount.code}): -${formatEUR(discount.amount)}`, 500, y, {align:'right'});
        y += 16;
      }

      doc.text(`Total: ${formatEUR(totals.total)}`, 500, y, {align:'right'});
      y += 50;
      doc.line(60, y - 10, 535, y - 10);
      doc.setFontSize(12);
      doc.text(payment.status === 'paid' ? 'Thank you for your purchase.' : 'Thank you for your order.', 65, y); y += 20;
      doc.setFontSize(11);
      doc.text(payment.status === 'paid' ? 'We hope this fragrance brings you quiet joy and warmth.' : 'This order will be fulfilled after payment is confirmed.', 65, y); y += 60;
      doc.setFontSize(10);
      doc.setTextColor('#475569');
      doc.text('pranavdj09-pixel.github.io/thewhitebutterflies', 65, y);
      doc.text('Email: pranavdj09@gmail.com | Phone: +31 6 84542568', 65, y + 14);
      doc.save(`Invoice_${order.orderId}.pdf`);
    }
  );


  requestPaymentStatus();
</script>

</body>
</html>
